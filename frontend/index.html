<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Performance Predictor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>🎓 Student Performance Predictor</h1>

            <p class="subtitle">
                Predict a student's final score using Machine Learning
            </p>

            <form id="predictionForm">

                <div class="input-group">
                    <label for="study_hours">📚 Study Hours</label>
                    <input
                        type="number"
                        id="study_hours"
                        placeholder="Enter study hours"
                        min="0"
                        step="0.1"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="attendance">📊 Attendance (%)</label>
                    <input
                        type="number"
                        id="attendance"
                        placeholder="Enter attendance percentage"
                        min="0"
                        max="100"
                        step="0.1"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="previous_score">📝 Previous Score</label>
                    <input
                        type="number"
                        id="previous_score"
                        placeholder="Enter previous score"
                        min="0"
                        max="100"
                        step="0.1"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="assignments_completed">
                        ✅ Assignments Completed
                    </label>

                    <input
                        type="number"
                        id="assignments_completed"
                        placeholder="Enter assignments completed"
                        min="0"
                        required
                    >
                </div>

                <button type="submit" id="predictButton">
                    Predict Final Score
                </button>

            </form>

            <div id="loading" class="loading hidden">
                Predicting...
            </div>

            <div id="result" class="result hidden">

                <h2>🎯 Prediction Result</h2>

                <div class="score" id="score">
                    0
                </div>

                <p>Predicted Final Score</p>

            </div>

            <div id="error" class="error hidden"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
